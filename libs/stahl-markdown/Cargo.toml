[package]
name = "stahl-markdown"
edition = "2021"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
name = "stahl_markdown"
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# stahl-core = { path = "../../crates/stahl-core", version = "0.6.0", features = ["dylibs"] }
stahl-core = { workspace = true }

# When developing
# stahl-core = { version = "0.6.0", features = ["dylibs"] }

pulldown-cmark = "0.11.2"
abi_stable = "0.11.1"
# For doing syntax highlighting!
syntect = "5.2.0"
